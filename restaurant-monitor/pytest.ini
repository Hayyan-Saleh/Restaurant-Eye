[pytest]
asyncio_mode = auto
; Postgres/Redis async clients (backend/app/core/database.py's module-level
; engine, backend/app/core/redis.py's module-level client) are constructed
; once and reused -- their asyncpg/redis connections get bound to whichever
; asyncio event loop is running the first time they're actually used. With
; pytest-asyncio's default per-test event loop, every test after the first
; one that touches Postgres fails with "Event loop is closed" or "another
; operation is in progress" because it's handed connections still bound to
; a *previous*, already-closed loop. One event loop for the whole session
; keeps every test on the same loop those connections were opened on.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
